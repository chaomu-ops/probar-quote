<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>鐠羅機械 | 報價系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2138;
    --navy2:#17324f;
    --steel:#4c5c6d;
    --steel-soft:#eef1f4;
    --paper:#faf9f6;
    --line:#d9dee3;
    --accent:#e2622a;
    --accent-dark:#b84a1a;
    --ink:#1a2230;
    --ok:#2f7a4d;
    --danger:#b23a2e;
    --danger-soft:#fbeae7;
    --shadow: 0 1px 2px rgba(15,33,56,.06), 0 8px 24px -12px rgba(15,33,56,.18);
    --topbar-h: 132px;
    font-size:15px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans TC', system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding-top:var(--topbar-h,132px);
  }
  ::selection{background:var(--accent);color:#fff;}
  input,textarea,select,button{font-family:inherit;font-size:14px;}
  input,textarea,select{
    background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:8px 9px;color:var(--ink); width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid #cfe0ee; border-color:var(--navy2);}
  textarea{resize:vertical;min-height:64px;line-height:1.5;}
  button{cursor:pointer;border:none;border-radius:6px;font-weight:600;transition:.12s transform ease, .12s background ease; touch-action:manipulation;}
  button:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;padding:10px 16px;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);padding:9px 14px;}
  .btn-ghost:hover{background:var(--steel-soft);}
  .btn-navy{background:var(--navy2);color:#fff;padding:9px 16px;}
  .btn-navy:hover{background:var(--navy);}
  .btn-danger{background:transparent;color:var(--danger);padding:7px 10px;border:1px solid transparent;}
  .btn-danger:hover{background:var(--danger-soft);border-color:#f0c9c2;}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:5px;}
  .btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--steel);border:1px solid var(--line);}
  .btn-icon:hover{background:var(--steel-soft);}

  /* ---------- shell ---------- */
  .topbar{
    min-height:132px; padding:14px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    position:fixed; top:0; left:0; right:0; width:100%; z-index:40;
    background: linear-gradient(135deg, var(--navy), var(--navy2));
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{height:46px;width:auto;flex:none;display:block;}
  .brand-text .k{font-family:'Noto Serif TC',serif; color:#fff; font-size:20px; font-weight:900; letter-spacing:.5px;}
  .brand-text .s{color:#9fb3c8; font-size:12px; letter-spacing:1.5px; margin-top:2px;}
  .tabs{display:flex; gap:4px; background:rgba(255,255,255,.06); padding:5px; border-radius:11px; flex-wrap:wrap;}
  .tab-btn{background:transparent; color:#c7d4e0; padding:9px 14px; border-radius:8px; font-weight:600; font-size:13px; letter-spacing:.2px; white-space:nowrap;}
  .tab-btn:hover{color:#fff; background:rgba(255,255,255,.08);}
  .tab-btn.active{background:var(--accent); color:#fff;}
  .container{max-width:1440px; margin:0 auto; padding:22px 20px 80px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:11px 20px; border-radius:9px; font-size:13.5px;
    box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .grid{display:grid; gap:18px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);}
  .card-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .card-head h2{margin:0; font-size:15px; color:var(--navy); letter-spacing:.2px;}
  .card-head .hint{font-size:12px; color:var(--steel);}
  .card-body{padding:16px 18px;}
  .section-label{font-size:11.5px; font-weight:700; color:var(--accent-dark); letter-spacing:1.2px; text-transform:uppercase; margin:0 0 8px;}
  label.field{display:block; font-size:12.5px; color:var(--steel); font-weight:600; margin-bottom:5px;}
  .field-row{display:grid; gap:12px;}
  .cols-2{grid-template-columns:1fr 1fr;}
  .cols-3{grid-template-columns:1fr 1fr 1fr;}
  .cols-4{grid-template-columns:1fr 1fr 1fr 1fr;}
  hr.rule{border:none; border-top:1px solid var(--line); margin:16px 0;}

  table{border-collapse:collapse; width:100%;}
  .tbl th{background:var(--steel-soft); color:var(--navy); text-align:left; font-size:12px; letter-spacing:.3px; padding:9px 10px; border:1px solid var(--line); white-space:nowrap;}
  .tbl td{padding:6px 8px; border:1px solid var(--line); vertical-align:middle;}
  .tbl input, .tbl select{border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:5px;}
  .tbl input:hover, .tbl select:hover{border-color:var(--line);}
  .tbl input:focus, .tbl select:focus{border-color:var(--navy2); background:#fff;}
  .tbl-wrap{overflow-x:auto; border-radius:8px; -webkit-overflow-scrolling:touch;}
  .num{text-align:right;}
  .muted{color:var(--steel);}
  .pill{display:inline-block; padding:3px 10px; border-radius:99px; background:var(--steel-soft); color:var(--navy); font-size:11px; font-weight:700; white-space:nowrap;}
  .pill.accent{background:#fdece2; color:var(--accent-dark);}
  .pill.btnlike{cursor:pointer; border:1px solid var(--line); background:#fff;}
  .pill.btnlike:hover{background:var(--steel-soft);}
  code{background:var(--steel-soft); padding:1px 6px; border-radius:4px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--navy);}

  /* catalog picker */
  .catalog-search{margin-bottom:12px;}
  .series-block{border:1px solid var(--line); border-radius:9px; margin-bottom:10px; overflow:hidden;}
  .series-head{display:flex; align-items:center; justify-content:space-between; padding:11px 13px; background:var(--steel-soft); cursor:pointer; user-select:none;}
  .series-head .title{font-weight:700; color:var(--navy); font-size:13px;}
  .series-head .chev{transition:transform .15s; color:var(--steel); flex:none;}
  .series-block.open .chev{transform:rotate(90deg);}
  .series-items{display:none; padding:8px 12px 12px;}
  .series-block.open .series-items{display:block;}
  .pick-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 4px; border-bottom:1px dashed var(--line);}
  .pick-row:last-child{border-bottom:none;}
  .pick-row .info{min-width:0; flex:1;}
  .pick-row .info .nm{font-weight:600; font-size:13px; color:var(--ink);}
  .pick-row .info .sp{font-size:11.5px; color:var(--steel);}
  .pick-row .price{font-size:12px; color:var(--navy); font-weight:700; white-space:nowrap; flex:none; width:78px; text-align:right;}
  .add-btn{background:var(--navy2); color:#fff; width:30px; height:30px; border-radius:7px; font-size:17px; line-height:1; flex:none;}
  .add-btn:hover{background:var(--accent);}

  .empty{padding:34px 20px; text-align:center; color:var(--steel);}
  .empty .big{font-size:30px; margin-bottom:8px;}

  .totals{display:flex; justify-content:flex-end; gap:24px; padding:14px 4px 4px; align-items:baseline; flex-wrap:wrap;}
  .totals .lbl{font-size:12.5px; color:var(--steel);}
  .totals .val{font-size:21px; font-weight:900; color:var(--navy); font-family:'Noto Serif TC',serif;}

  .term-line{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .term-line .idx{width:20px; flex:none; color:var(--steel); font-size:12px; text-align:right;}

  .layout-2col{display:grid; grid-template-columns:340px 1fr; gap:18px; align-items:start; min-height:calc(100vh - var(--topbar-h,132px) - 40px);}
  @media (max-width:980px){ .layout-2col{grid-template-columns:1fr; min-height:0;} .cols-2,.cols-3,.cols-4{grid-template-columns:1fr;} }
  @media (max-width:640px){
    :root{font-size:14px;}
    .topbar{padding:12px 16px;}
    .container{padding:16px 12px 70px;}
    .card-body{padding:13px 14px;}
    .totals{justify-content:flex-start;}
  }
  .sticky-side{position:relative;}
  @media (min-width:981px){ .sticky-side{position:sticky; top:calc(var(--topbar-h,132px) + 20px); max-height:calc(100vh - var(--topbar-h,132px) - 170px); overflow-y:auto;} }

  .section-card{border:1.5px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden;}
  .section-card.is-target{border-color:var(--accent);}
  .section-card .sc-head{display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--steel-soft); flex-wrap:wrap;}
  .section-card .sc-head input.sc-title{font-weight:700; font-size:14px; max-width:280px; background:#fff;}
  .section-card .sc-body{padding:14px;}

  .quotes-table td.name{font-weight:600;}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}

  .checkbox-line{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--steel); margin-bottom:10px;}
  .checkbox-line input{width:auto;}

  .addsec-row{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
  .addsec-row input{flex:1; min-width:160px;}

  /* ---------- print modal ---------- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(15,20,28,.6); z-index:300; display:flex; align-items:flex-start; justify-content:center; padding:18px; overflow:auto;}
  .modal-toolbar{position:sticky; top:0; display:flex; justify-content:flex-end; gap:10px; max-width:210mm; margin:0 auto 12px; z-index:5; flex-wrap:wrap;}
  .print-pages{max-width:100%;}
  /* 列印文件一律用系統內建中文字型(不依賴網路字型),避免字型非同步載入造成分頁量測失準 */
  .print-sheet{
    background:#fff; width:210mm; height:297mm; max-width:100%; overflow:hidden;
    margin:0 auto 22px; padding:14mm 16mm; box-shadow:0 20px 60px rgba(0,0,0,.35);
    font-family:system-ui,-apple-system,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;
    font-size:12.3px; color:#111; line-height:1.5; position:relative; box-sizing:border-box;
  }
  .measure-ctx{ font-family:system-ui,-apple-system,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif; font-size:12.3px; line-height:1.5; color:#111; }
  .ps-pagenum{font-size:9.5px; color:#444; margin-bottom:6px;}
  .ps-seal{
    position:absolute; right:5mm;
    display:flex; flex-direction:column; align-items:center;
    color:#c0272d; border:1.6px solid #c0272d; border-radius:5px;
    padding:10px 6px; opacity:.8; background:rgba(255,255,255,.5);
  }
  .ps-seal span{font-size:15px; font-weight:800; line-height:1.5; font-family:'Microsoft JhengHei','PingFang TC',sans-serif;}
  /* 章的上半部貼在本頁最下緣,下半部超出頁面範圍(被 .print-sheet 的 overflow:hidden 裁掉) */
  .ps-seal-bottom{ bottom:0; transform:translateY(50%); }
  /* 章的下半部貼在下一頁最上緣,上半部超出頁面範圍(被裁掉),與上一頁的上半部剛好接續 */
  .ps-seal-top{ top:0; transform:translateY(-50%); }
  .ps-header2{display:flex; align-items:flex-start; gap:16px; margin-bottom:4px;}
  .ps-header2 img{height:50px; width:auto; display:block; flex:none; margin-top:30px;}
  .ps-cinfo{padding-top:6px;}
  .ps-cinfo .cname{font-family:'Microsoft JhengHei','PingFang TC',sans-serif; font-weight:900; font-size:30px; margin-bottom:7px; letter-spacing:1px;}
  .ps-cinfo .cline{font-size:10px; color:#333; line-height:1.85; letter-spacing:.3px;}
  .ps-doc-title{text-align:center; font-size:20px; font-weight:800; letter-spacing:14px; padding-left:14px; margin:8px 0 14px;}
  .ps-meta{display:grid; grid-template-columns:1fr 1fr; border:1.4px solid #111; margin-bottom:14px;}
  .ps-meta div{padding:6px 12px; border-bottom:1px solid #111; word-break:break-all;}
  .ps-meta div:nth-child(odd){border-right:1px solid #111;}
  .ps-meta div:nth-last-child(-n+2){border-bottom:none;}
  .ps-meta b{margin-right:4px;}
  .ps-box{border:1.6px solid #111; padding:14px 16px 16px; margin-bottom:12px;}
  .ps-box-title{text-align:center; font-weight:800; font-size:14px; text-decoration:underline; text-underline-offset:5px; margin-bottom:10px; letter-spacing:2px;}
  .ps-tbl{width:100%; border-collapse:collapse; margin-bottom:4px;}
  .ps-tbl th{border:1.2px solid #111; background:#f2f2f2; padding:6px 6px; font-size:11px;}
  .ps-tbl td{border:1.2px solid #111; padding:6px 6px; font-size:11px; text-align:center;}
  .ps-tbl td.left{text-align:left;}
  .ps-tbl tfoot td{font-weight:800; background:#f7f7f7;}
  .ps-note{font-size:10.5px; margin-top:8px; line-height:1.65;}
  .ps-grandtotal{font-weight:800; font-size:12.5px; margin-bottom:10px; text-align:right; border-bottom:1px dashed #999; padding-bottom:8px;}
  .ps-terms .t-title{font-weight:800; text-decoration:underline; text-underline-offset:4px; margin-bottom:6px; font-size:11.5px;}
  .ps-terms ol{margin:0; padding-left:18px;}
  .ps-terms li{margin-bottom:3px; font-size:11px;}
  .ps-sign{display:grid; grid-template-columns:1fr 1fr 1fr; border:1.4px solid #111;}
  .ps-sign div{padding:8px 10px; border-right:1px solid #111; min-height:52px;}
  .ps-sign div:last-child{border-right:none;}
  .ps-sign b{font-size:11.5px;}

  @page{ size:A4; margin:0; }
  @media print{
    /* 關鍵修正:用 display:none 讓其他畫面真正離開版面(而非 visibility:hidden 讓它仍佔位),
       並讓報價單維持在正常文件流中,瀏覽器的分頁引擎才能正確依 page-break-after 分頁,
       不會把所有頁面內容擠壓成一長條、切出多餘或重複的頁面。 */
    body{background:#fff !important;}
    body > *{ display:none !important; }
    #modalRoot{ display:block !important; }
    #modalRoot .modal-backdrop{
      position:static !important; inset:auto !important; background:none !important;
      padding:0 !important; display:block !important; overflow:visible !important;
    }
    .print-pages{ display:block !important; position:static !important; width:auto !important; margin:0 !important; }
    .print-sheet{box-shadow:none; margin:0 auto; page-break-after:always; break-after:page;}
    .print-sheet:last-child{page-break-after:auto; break-after:auto;}
    .ps-box, .ps-sign, .ps-header2, .ps-meta{page-break-inside:avoid; break-inside:avoid;}
    .no-print{display:none !important;}
  }
  @media (max-width:820px){
    .print-sheet{padding:9mm 8mm; font-size:11.5px; transform-origin:top center;}
  }

  /* json modal */
  .json-modal .print-sheet{width:640px; height:auto; min-height:auto; overflow:visible;}
  .json-box{width:100%; height:280px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px;}

  footer.app-foot{max-width:1440px;margin:0 auto;padding:0 20px 40px;color:#9fb3c8;font-size:11.5px;}
</style>
</head>

function genId(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('en-US', {maximumFractionDigits:0}); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function addDays(dateStr, days){ const d = new Date(dateStr); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function fmtDateZh(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${y}年${Number(m)}月${Number(d)}日`;
}
const CHN = ['','壹','貳','參','肆','伍','陸','柒','捌','玖','拾'];
function chineseQty(n){
  n = Number(n)||0;
  if(n>=1 && n<=10) return CHN[n];
  return String(n);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2000);
}

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('載入失敗: '+src));
    document.head.appendChild(s);
  });
}

async function initFirebaseStorage(){
  const V = '10.12.2';
  await loadScriptOnce(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScriptOnce(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);
  await loadScriptOnce(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
  if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  await firebase.auth().signInAnonymously();
  const db = firebase.firestore();
  firestoreDbRef = db;
  return {
    async get(key){
      const snap = await db.collection('kv').doc(key).get();
      if(!snap.exists) throw new Error('not found: '+key);
      return { key, value: snap.data().value };
    },
    async set(key, value){
      await db.collection('kv').doc(key).set({ value, updatedAt: Date.now() });
      return { key, value };
    }
  };
}

/* ---- 報價單獨立存檔 + 即時同步:Firebase 版(用 Firestore onSnapshot 即時推播) ---- */
function buildFirebaseQuoteStore(db){
  return {
    subscribe(onChange){
      db.collection('quotes').onSnapshot(snap=>{
        const arr = [];
        snap.forEach(doc=> arr.push(migrateQuote(doc.data())));
        arr.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
        onChange(arr);
      }, err=> console.error('quotes onSnapshot error', err));
      return Promise.resolve();
    },
    async save(quote){ await db.collection('quotes').doc(quote.id).set(quote); },
    async remove(id){ await db.collection('quotes').doc(id).delete(); }
  };
}

/* ---- 報價單獨立存檔 + 準即時同步:Claude.ai 內建儲存版(索引+個別文件, 定時輪詢) ---- */
function buildArtifactQuoteStore(){
  let pollTimer = null, onChangeRef = null, currentArr = [];
  const known = {};
  function summaryOf(q){ return {id:q.id, quoteNo:q.quoteNo, to:q.to, date:q.date, updatedAt:q.updatedAt||0}; }
  async function fetchIndex(){
    try{ const r = await Storage.get('quotes-index', true); return r ? JSON.parse(r.value) : []; }
    catch(e){ return []; }
  }
  async function writeIndex(idx){ await Storage.set('quotes-index', JSON.stringify(idx), true); }
  async function poll(){
    const idx = await fetchIndex();
    const idxIds = new Set(idx.map(s=>s.id));
    let changed = false;
    currentArr = currentArr.filter(q=>{
      if(!idxIds.has(q.id)){ delete known[q.id]; changed = true; return false; }
      return true;
    });
    for(const s of idx){
      if(known[s.id] !== s.updatedAt){
        try{
          const r = await Storage.get('quote:'+s.id, true);
          if(r){
            const full = migrateQuote(JSON.parse(r.value));
            known[s.id] = s.updatedAt;
            const i = currentArr.findIndex(q=>q.id===s.id);
            if(i>=0) currentArr[i]=full; else currentArr.push(full);
            changed = true;
          }
        }catch(e){ /* 該筆可能剛好正在寫入,下一輪再抓 */ }
      }
    }
    if(changed){
      currentArr.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      if(onChangeRef) onChangeRef(currentArr.slice());
    }
  }
  return {
    async subscribe(onChange){
      onChangeRef = onChange;
      await poll();
      onChange(currentArr.slice());
      if(pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(poll, 10000);
    },
    async save(quote){
      quote.updatedAt = Date.now();
      await Storage.set('quote:'+quote.id, JSON.stringify(quote), true);
      const idx = await fetchIndex();
      const i = idx.findIndex(x=>x.id===quote.id);
      const sum = summaryOf(quote);
      if(i>=0) idx[i]=sum; else idx.unshift(sum);
      await writeIndex(idx);
      known[quote.id] = quote.updatedAt;
      const ci = currentArr.findIndex(q=>q.id===quote.id);
      if(ci>=0) currentArr[ci]=quote; else currentArr.unshift(quote);
      if(onChangeRef) onChangeRef(currentArr.slice());
    },
    async remove(id){
      try{ await Storage.delete('quote:'+id, true); }catch(e){}
      const idx = await fetchIndex();
      await writeIndex(idx.filter(x=>x.id!==id));
      delete known[id];
      currentArr = currentArr.filter(q=>q.id!==id);
      if(onChangeRef) onChangeRef(currentArr.slice());
    }
  };
}

/* ---- 報價單存檔:純本機暫存版(無雲端儲存時) ---- */
function buildMemoryQuoteStore(){
  let arr = [], onChangeRef = null;
  return {
    async subscribe(onChange){ onChangeRef = onChange; onChange(arr.slice()); },
    async save(quote){
      quote.updatedAt = Date.now();
      const i = arr.findIndex(q=>q.id===quote.id);
      if(i>=0) arr[i]=quote; else arr.unshift(quote);
      if(onChangeRef) onChangeRef(arr.slice());
    },
    async remove(id){
      arr = arr.filter(q=>q.id!==id);
      if(onChangeRef) onChangeRef(arr.slice());
    }
  };
}

async function initStorageBackend(){
  if(HAS_ARTIFACT_STORAGE){
    Storage = window.storage; backendMode = 'artifact';
    QuoteStore = buildArtifactQuoteStore();
    return;
  }
  if(HAS_FIREBASE_CONFIG){
    try{
      Storage = await initFirebaseStorage();
      backendMode = 'firebase';
      QuoteStore = buildFirebaseQuoteStore(firestoreDbRef);
      return;
    }catch(e){ console.error('Firebase 初始化失敗', e); Storage = null; backendMode = 'none'; }
  }
  Storage = null; backendMode = 'none';
  QuoteStore = buildMemoryQuoteStore();
}

function backendLabel(){
  if(backendMode==='artifact') return 'Claude.ai 內建雲端儲存(共用,報價單約 10 秒同步一次)';
  if(backendMode==='firebase') return 'Firebase Firestore(共用,報價單即時同步)';
  if(HAS_FIREBASE_CONFIG) return 'Firebase 設定有誤或連線失敗,目前僅本機暫存';
  return '尚未設定雲端儲存,目前僅本機暫存(重新整理後資料會消失)';
}

async function loadAll(){
  await initStorageBackend();
  if(Storage){
    try{
      const r = await Storage.get('catalog', true);
      catalog = r ? JSON.parse(r.value) : defaultCatalog();
    }catch(e){ catalog = defaultCatalog(); }
  } else {
    catalog = defaultCatalog();
  }
  if(!catalog.customers) catalog.customers = []; /* 相容舊版雲端資料(尚無客戶管理欄位) */
  if(!QuoteStore) QuoteStore = buildMemoryQuoteStore();
  await QuoteStore.subscribe(arr=>{
    quotes = arr;
    if(loaded) renderAll();
  });
  loaded = true;
  newQuote();
  renderAll();
  if(!Storage) toast('未偵測到雲端儲存,本次資料僅暫存於瀏覽器,關閉後將不會保留');
}
async function saveCatalog(silent){
  if(!Storage){ memFallback.catalog = catalog; if(!silent) toast('已暫存(未連接雲端儲存)'); return; }
  try{
    await Storage.set('catalog', JSON.stringify(catalog), true);
    if(!silent) toast('已儲存目錄變更');
  }catch(e){ console.error(e); toast('儲存失敗,請稍後再試'); }
}

/* 舊資料格式(單一 title/items/standardAccNote)自動轉為多標題 sections 格式 */
function migrateQuote(q){
  if(!q.sections){
    q.sections = [{
      id:genId('sec'),
      title:q.title || '報價明細',
      note:q.standardAccNote || '',
      items:q.items || []
    }];
    delete q.title; delete q.items; delete q.standardAccNote;
  }
  if(!q.targetSectionId) q.targetSectionId = (q.sections[0] && q.sections[0].id) || null;
  if(q.showUsd===undefined) q.showUsd = false;
  if(!q.quoterEmail) q.quoterEmail = (catalog.companyInfo && catalog.companyInfo.email) || '';
  if(q.customerId===undefined) q.customerId = null;
  return q;
}

========================================================= */
const TABS = [
  {id:'builder', label:'建立報價單'},
  {id:'quotes', label:'報價單管理'},
  {id:'customers', label:'客戶管理'},
  {id:'models', label:'機型管理'},
  {id:'accessories', label:'配件管理'},
  {id:'settings', label:'系統設定'}
];
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<button class="tab-btn ${TAB===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}
function switchTab(id){ TAB = id; renderAll(); window.scrollTo({top:0, behavior:'smooth'}); }

function renderAll(){
  const prevSideScroll = (() => { const el = document.querySelector('.sticky-side'); return el ? el.scrollTop : null; })();
  const prevWinScroll = window.scrollY;
  const activeEl = document.activeElement;
  const activeId = (activeEl && activeEl.id) ? activeEl.id : null;
  const hasSelection = activeEl && typeof activeEl.selectionStart === 'number';
  const selStart = hasSelection ? activeEl.selectionStart : null;
  const selEnd = hasSelection ? activeEl.selectionEnd : null;

  renderTabs();
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = `<div class="empty">載入中...</div>`; return; }
  if(TAB==='builder') app.innerHTML = renderBuilder();
  else if(TAB==='quotes') app.innerHTML = renderQuotesTab();
  else if(TAB==='customers') app.innerHTML = renderCustomersTab();
  else if(TAB==='models') app.innerHTML = renderModelsTab();
  else if(TAB==='accessories') app.innerHTML = renderAccessoriesTab();
  else if(TAB==='settings') app.innerHTML = renderSettingsTab();

  if(prevSideScroll !== null){
    const newSide = document.querySelector('.sticky-side');
    if(newSide) newSide.scrollTop = prevSideScroll;
  }
  window.scrollTo(window.scrollX, prevWinScroll);

  if(activeId){
    const restored = document.getElementById(activeId);
    if(restored){
      restored.focus();
      if(selStart !== null && restored.setSelectionRange){
        try{ restored.setSelectionRange(selStart, selEnd); }catch(e){ /* 部分 input type 不支援,忽略即可 */ }
      }
    }
  }
}

/* =========================================================
   報價單 資料模型 (多標題 sections)
========================================================= */
function blankQuote(){
  const d = todayStr();
  const valid = addDays(d, 30);
  return {
    id: genId('q'),
    quoteNo: suggestQuoteNo(),
    date: d,
    to:'', attn:'', tel:'', fax:'', cno:'',
    customerId: null,
    validDate: valid,
    quoterEmail: (catalog.companyInfo && catalog.companyInfo.email) || '',
    sections:[],
    targetSectionId:null,
    terms:[...catalog.defaultTerms],
    showUsd:false,
    createdAt: Date.now(), updatedAt: Date.now()
  };
}
function suggestQuoteNo(){
  const d = new Date();
  const ymd = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const seq = quotes.filter(q=>q.quoteNo && q.quoteNo.includes(ymd)).length + 1;
  return `Q${ymd}-${String(seq).padStart(3,'0')}`;
}
function newQuote(){
  currentQuote = blankQuote();
}

function findModel(seriesId, modelId){
  const s = catalog.series.find(x=>x.id===seriesId);
  if(!s) return null;
  const m = s.models.find(x=>x.id===modelId);
  return m ? {series:s, model:m} : null;
}
function findSection(sectionId){
  return currentQuote.sections.find(s=>s.id===sectionId);
}
function ensureSectionForSeries(series){
  let sec = currentQuote.sections.find(s=>s.title===series.name);
  if(!sec){
    sec = {id:genId('sec'), title:series.name, note:'', items:[]};
    currentQuote.sections.push(sec);
  }
  currentQuote.targetSectionId = sec.id;
  return sec;
}
function currentTargetSection(){
  let sec = findSection(currentQuote.targetSectionId);
  if(!sec) sec = currentQuote.sections[currentQuote.sections.length-1];
  return sec;
}
function addSection(title){
  const sec = {id:genId('sec'), title: title && title.trim() ? title.trim() : '新機型系列', note:'', items:[]};
  currentQuote.sections.push(sec);
  currentQuote.targetSectionId = sec.id;
  renderAll();
}
function addSectionFromInput(){
  const el = document.getElementById('newSecTitle');
  const v = el ? el.value : '';
  addSection(v);
}
function removeSection(sid){
  if(!confirm('確定刪除此標題與其所有項目嗎?')) return;
  currentQuote.sections = currentQuote.sections.filter(s=>s.id!==sid);
  if(currentQuote.targetSectionId===sid) currentQuote.targetSectionId = (currentQuote.sections[0]||{}).id || null;
  renderAll();
}
function updateSectionField(sid, field, value){
  const s = findSection(sid);
  if(!s) return;
  s[field] = value;
}
function setTargetSection(sid){ currentQuote.targetSectionId = sid; renderAll(); }

function addItemFromModel(seriesId, modelId){
  const found = findModel(seriesId, modelId);
  if(!found) return;
  const {series, model} = found;
  const sec = ensureSectionForSeries(series);
  sec.items.push({
    id: genId('it'), name: model.name, desc: series.productType, spec: model.spec,
    qty:1, unit:'台', price: model.customer||0, usd: model.usd||0, note:''
  });
  appendSectionNote(sec, series.standardAcc);
  renderAll();
  toast(`已加入 ${model.name} 至「${sec.title}」`);
}
function addItemFromAccessory(groupId, itemId){
  const g = catalog.accessoryGroups.find(x=>x.id===groupId);
  if(!g) return;
  const it = g.items.find(x=>x.id===itemId);
  if(!it) return;
  let sec = currentTargetSection();
  if(!sec){
    sec = {id:genId('sec'), title:'配件', note:'', items:[]};
    currentQuote.sections.push(sec);
    currentQuote.targetSectionId = sec.id;
  }
  sec.items.push({
    id: genId('it'), name: it.name, desc:'選購配備', spec: it.spec||'',
    qty:1, unit:'組', price: it.customer||0, usd: it.usd||0, note:''
  });
  renderAll();
  toast(`已加入 ${it.name} 至「${sec.title}」`);
}
function appendSectionNote(sec, text){
  if(!text) return;
  if(!sec.note){ sec.note = text; return; }
  if(!sec.note.includes(text)) sec.note += '\n' + text;
}
function addCustomItemToSection(sid){
  const sec = findSection(sid);
  if(!sec) return;
  sec.items.push({id:genId('it'), name:'', desc:'', spec:'', qty:1, unit:'台', price:0, usd:0, note:''});
  renderAll();
}
function addInstallFeeItem(feeId){
  const f = catalog.installFees.find(x=>x.id===feeId);
  if(!f) return;
  let sec = currentTargetSection();
  if(!sec){
    sec = {id:genId('sec'), title:'服務費', note:'', items:[]};
    currentQuote.sections.push(sec);
    currentQuote.targetSectionId = sec.id;
  }
  sec.items.push({id:genId('it'), name:'裝機/連線/服務費', desc:f.label, spec:'', qty:1, unit:'式', price:f.ntd||0, usd:f.usd||0, note:''});
  renderAll();
  toast('已加入安裝服務費');
}
function updateItemField(sid, iid, field, value){
  const sec = findSection(sid);
  if(!sec) return;
  const it = sec.items.find(x=>x.id===iid);
  if(!it) return;
  if(['qty','price','usd'].includes(field)) value = money(value);
  it[field] = value;
  if(field==='qty' || field==='price') renderBuilderTotalsOnly();
}
function removeItem(sid, iid){
  const sec = findSection(sid);
  if(!sec) return;
  sec.items = sec.items.filter(x=>x.id!==iid);
  renderAll();
}
function quoteTotal(q){
  return (q.sections||[]).reduce((sum, sec) => sum + (sec.items||[]).reduce((s,it)=> s + (money(it.qty)*money(it.price)), 0), 0);
}
function quoteTotalUsd(q){
  return (q.sections||[]).reduce((sum, sec) => sum + (sec.items||[]).reduce((s,it)=> s + (money(it.qty)*money(it.usd)), 0), 0);
}
function updateQuoteField(field, value){ currentQuote[field] = value; }
function updateTermLine(idx, value){ currentQuote.terms[idx] = value; }
function addTermLine(){ currentQuote.terms.push(''); renderAll(); }
function removeTermLine(idx){ currentQuote.terms.splice(idx,1); renderAll(); }
function toggleShowUsd(v){ currentQuote.showUsd = v; renderAll(); }

function renderBuilderTotalsOnly(){
  const el = document.getElementById('qTotalVal');
  if(el) el.textContent = 'NT$ ' + fmtMoney(quoteTotal(currentQuote));
  const el2 = document.getElementById('qTotalUsdVal');
  if(el2) el2.textContent = 'US$ ' + fmtMoney(quoteTotalUsd(currentQuote));
}

async function saveQuote(){
  if(!currentQuote.to){ toast('請先填寫客戶(TO)名稱'); return; }
  if(!currentQuote.sections.length){ toast('請至少加入一個標題與報價項目'); return; }
  currentQuote.updatedAt = Date.now();
  const toSave = JSON.parse(JSON.stringify(currentQuote));
  try{
    await QuoteStore.save(toSave);
    toast('已儲存報價單 ' + currentQuote.quoteNo);
  }catch(e){ console.error(e); toast('儲存失敗,請稍後再試'); }
  renderAll();
}
function loadQuoteForEdit(id){
  const q = quotes.find(x=>x.id===id);
  if(!q) return;
  currentQuote = migrateQuote(JSON.parse(JSON.stringify(q)));
  TAB='builder';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}
function duplicateQuote(id){
  const q = quotes.find(x=>x.id===id);
  if(!q) return;
  const copy = migrateQuote(JSON.parse(JSON.stringify(q)));
  copy.id = genId('q');
  copy.quoteNo = suggestQuoteNo();
  copy.date = todayStr();
  copy.validDate = addDays(copy.date, 30);
  copy.createdAt = Date.now(); copy.updatedAt = Date.now();
  currentQuote = copy;
  TAB='builder';
  renderAll();
  toast('已複製為新報價單(日期已更新為今天),尚未儲存');
}
async function deleteQuote(id){
  if(!confirm('確定要刪除這張報價單嗎?此動作無法復原。')) return;
  try{
    await QuoteStore.remove(id);
    toast('已刪除報價單');
  }catch(e){ console.error(e); toast('刪除失敗,請稍後再試'); }
  renderAll();
}

/* 取得某客戶的歷史報價項目(依 customerId 精準比對,若舊報價單沒有 customerId 則退而用客戶名稱比對) */
function customerHistory(customer){
  const rows = [];
  quotes.forEach(q=>{
    const matched = q.customerId ? (q.customerId === customer.id)
      : (q.to && customer.name && q.to.trim() === customer.name.trim() && customer.name.trim() !== '');
    if(!matched) return;
    (q.sections||[]).forEach(sec=>{
      (sec.items||[]).forEach(it=>{
        rows.push({
          quoteNo: q.quoteNo, date: q.date || '',
          section: sec.title, name: it.name, spec: it.spec||'',
          qty: it.qty, unit: it.unit||'', price: it.price
        });
      });
    });
  });
  rows.sort((a,b)=>{
    const nm = (a.name||'').localeCompare(b.name||'');
    if(nm !== 0) return nm;
    return (b.date||'').localeCompare(a.date||'');
  });
  return rows;
}

function renderCustomerHistoryPanel(customer){
  const rows = customerHistory(customer);
  if(!rows.length){
    return `<div class="muted" style="padding:10px 4px;font-size:12.5px;">此客戶尚無任何歷史報價紀錄。</div>`;
  }
  return `
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>機型</th><th>規格</th><th>數量</th><th>售價(NTD)</th><th>報價單號</th><th>日期</th><th>標題</th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${escapeHtml(r.name)}</td>
              <td>${escapeHtml(r.spec)}</td>
              <td>${r.qty}${escapeHtml(r.unit)}</td>
              <td class="num">NT$${fmtMoney(r.price)}</td>
              <td>${escapeHtml(r.quoteNo)}</td>
              <td>${escapeHtml(r.date)}</td>
              <td>${escapeHtml(r.section)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function customersMatch(c, q){
  if(!q) return true;
  q = q.toLowerCase();
  return (c.name||'').toLowerCase().includes(q) || (c.code||'').toLowerCase().includes(q);
}

function renderCustomersTab(){
  const list = catalog.customers.filter(c=>customersMatch(c, customerSearch));
  const rows = list.map(c=>{
    const open = !!expandedCustomers[c.id];
    const histCount = customerHistory(c).length;
    return `
    <tr>
      <td><input value="${escapeHtml(c.code)}" placeholder="例:886-CM046" onchange="updateCustomerField('${c.id}','code',this.value)"></td>
      <td><input value="${escapeHtml(c.name)}" placeholder="客戶名稱" onchange="updateCustomerField('${c.id}','name',this.value)"></td>
      <td><input value="${escapeHtml(c.tel)}" placeholder="聯絡電話" onchange="updateCustomerField('${c.id}','tel',this.value)"></td>
      <td><input value="${escapeHtml(c.fax)}" placeholder="傳真" onchange="updateCustomerField('${c.id}','fax',this.value)"></td>
      <td><input value="${escapeHtml(c.email)}" placeholder="Email" onchange="updateCustomerField('${c.id}','email',this.value)"></td>
      <td>
        <div class="row-actions">
          <button class="btn-ghost btn-sm" onclick="toggleCustomerHistory('${c.id}')">${open?'收合':'歷史報價'}(${histCount})</button>
          <button class="btn-danger btn-sm" onclick="deleteCustomer('${c.id}')">刪除</button>
        </div>
      </td>
    </tr>
    ${open ? `<tr><td colspan="6" style="background:var(--steel-soft);">${renderCustomerHistoryPanel(c)}</td></tr>` : ''}
  `;}).join('');

  return `
    <div class="card">
      <div class="card-head">
        <h2>客戶管理</h2>
        <button class="btn-primary btn-sm" onclick="addCustomer()">＋ 新增客戶</button>
      </div>
      <div class="card-body">
        <input class="catalog-search" id="customerSearchInput" placeholder="搜尋客戶編號 / 名稱..." value="${escapeHtml(customerSearch)}" style="margin-bottom:14px;max-width:320px;" oninput="customerSearch=this.value; renderAll();">
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>客戶編號</th><th>客戶名稱</th><th>聯絡電話</th><th>傳真</th><th>Email</th><th>操作</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="6" class="muted" style="text-align:center;padding:20px;">尚無客戶資料,請點右上角新增</td></tr>`}</tbody>
          </table>
        </div>
        <p class="hint" style="margin-top:10px;">「歷史報價」會列出這位客戶過去每一次報價單中出現過的機型、規格、售價與日期,方便回顧歷史成交行情。</p>
      </div>

function selectCustomerForQuote(cid){
  currentQuote.customerId = cid || null;
  if(cid){
    const c = catalog.customers.find(x=>x.id===cid);
    if(c){
      currentQuote.to = c.name || currentQuote.to;
      currentQuote.tel = c.tel || currentQuote.tel;
      currentQuote.fax = c.fax || currentQuote.fax;
      currentQuote.cno = c.code || currentQuote.cno;
    }
  }
  renderAll();
}
async function saveCurrentAsCustomer(){
  if(!currentQuote.to){ toast('請先填寫客戶名稱(TO)'); return; }
  const existing = catalog.customers.find(x=>x.name && x.name.trim()===currentQuote.to.trim());
  if(existing){
    currentQuote.customerId = existing.id;
    toast('已連結到現有客戶「'+existing.name+'」');
    renderAll();
    return;
  }
  const c = {id:genId('cust'), code:currentQuote.cno||'', name:currentQuote.to, tel:currentQuote.tel||'', fax:currentQuote.fax||'', email:'', note:''};
  catalog.customers.push(c);
  currentQuote.customerId = c.id;
  await saveCatalog(true);
  renderAll();
  toast('已將目前客戶資料存入客戶管理,可至該分頁補充 Email');
}

}

/* =========================================================
   列印預覽 — A4 分頁(以「標題區塊」為最小單位,不切割表格)
========================================================= */
const MM_PX = 96/25.4;
const PAGE_H_MM = 297;
const PAD_V_MM = 14;
const CONTENT_W_MM = 210 - 16*2;
const CAPACITY_PX = (PAGE_H_MM - PAD_V_MM*2) * MM_PX - 60; /* 60px 緩衝給頁碼列 + 跨瀏覽器/列印引擎的誤差保護 */

async function fontsReady(){
  try{
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  }catch(e){ /* 忽略,不支援就直接繼續 */ }
}

function measureHeights(htmlList){
  const stage = document.createElement('div');
  stage.className = 'measure-ctx';
  stage.style.position = 'fixed';
  stage.style.left = '-99999px';
  stage.style.top = '0';
  stage.style.width = CONTENT_W_MM + 'mm';
  stage.style.visibility = 'hidden';
  document.body.appendChild(stage);
  const heights = htmlList.map(html=>{
    const d = document.createElement('div');
    d.innerHTML = html;
    stage.appendChild(d);
    const h = d.getBoundingClientRect().height;
    stage.removeChild(d);
    return h;
  });
  document.body.removeChild(stage);
  return heights;
}

function shortCompanyName(){
  const n = (catalog.companyInfo && catalog.companyInfo.name) || '';
  return n.replace(/(工業股份有限公司|股份有限公司|有限公司|企業社)$/,'') || n;
}

      <div class="cline">TEL:${escapeHtml(c.tel)}&nbsp;&nbsp;&nbsp;http://${escapeHtml((c.web||'').replace(/^https?:\/\//,''))}</div>
      <div class="cline">FAX:${escapeHtml(c.fax)}&nbsp;&nbsp;&nbsp;E-mail:${escapeHtml(quoterEmail)}</div>

    <div><b>Attn:</b>${escapeHtml(quote.attn)}</div><div><b>Tel:</b>${escapeHtml(quote.tel)}</div>
    <div><b>C/No:</b>${escapeHtml(quote.cno)}</div><div><b>Fax:</b>${escapeHtml(quote.fax)}</div>

function sectionBlockHtml(quote, sec){
  const usdCol = quote.showUsd;
  const rows = sec.items.map(it => `
    <tr>
      <td class="left"><b>${escapeHtml(it.name)}</b>${it.desc? '<br><span style="color:#555;">'+escapeHtml(it.desc)+'</span>':''}</td>
      <td>${escapeHtml(it.spec||'')}</td>
      <td>${chineseQty(it.qty)}${escapeHtml(it.unit||'台')}</td>
      <td>$${fmtMoney(it.price)}</td>
      ${usdCol? `<td>$${fmtMoney(it.usd||0)}</td>`:''}
      <td class="left">${escapeHtml(it.note||'')}</td>
    </tr>
  `).join('');
  const secTotal = sec.items.reduce((s,it)=>s+money(it.qty)*money(it.price),0);
  const secTotalUsd = sec.items.reduce((s,it)=>s+money(it.qty)*money(it.usd),0);
  const noteLines = (sec.note||'').split('\n').filter(Boolean).map(l=>`<div>※${escapeHtml(l)}</div>`).join('');
  return `
  <div class="ps-box">
    <div class="ps-box-title">${escapeHtml(sec.title || '報 價 明 細')}</div>
    <table class="ps-tbl">
      <thead><tr>
        <th style="width:26%;">機 型</th><th style="width:14%;">規 格</th><th style="width:10%;">數量</th>
        <th style="width:14%;">售價(NTD)</th>${usdCol?'<th style="width:12%;">售價(USD)</th>':''}<th>備 註</th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan="${usdCol?6:5}">尚無項目</td></tr>`}</tbody>
      ${sec.items.length>1 ? `<tfoot><tr>
        <td colspan="3">小計 Subtotal</td>
        <td>$${fmtMoney(secTotal)}</td>${usdCol? `<td>$${fmtMoney(secTotalUsd)}</td>`:''}<td></td>
      </tr></tfoot>` : ''}
    </table>
    ${noteLines? `<div class="ps-note">${noteLines}</div>`:''}
  </div>`;
}

function tailBlockHtml(quote, grandTotal, grandTotalUsd, showGrand){
  const termsHtml = quote.terms.filter(t=>t && t.trim()).map(t=>`<li>${escapeHtml(t)}</li>`).join('')
      + `<li>有效日期:${fmtDateZh(quote.validDate)}。</li>`;
  return `
  <div class="ps-box">
    ${showGrand? `<div class="ps-grandtotal">報價總計 GRAND TOTAL:&nbsp; NT$ ${fmtMoney(grandTotal)}${quote.showUsd? ' / US$ '+fmtMoney(grandTotalUsd):''}</div>`:''}
    <div class="ps-terms">
      <div class="t-title">交易條件:</div>
      <ol>${termsHtml}</ol>
    </div>
  </div>
  <div class="ps-sign">
    <div><b>董事長</b></div><div><b>業務</b></div><div><b>製單</b></div>
  </div>`;
}

async function buildPages(quote){
  await fontsReady();
  const grandTotal = quoteTotal(quote);
  const grandTotalUsd = quoteTotalUsd(quote);
  const showGrand = (quote.sections.length>1) || quote.sections.some(s=>s.items.length>1);

  const atoms = [];
  atoms.push(metaBlockHtml(quote));
  quote.sections.forEach(sec => atoms.push(sectionBlockHtml(quote, sec)));
  atoms.push(tailBlockHtml(quote, grandTotal, grandTotalUsd, showGrand));

  const heights = measureHeights(atoms);
  const pages = [];
  let cur = [], curH = 0;
  atoms.forEach((html, i) => {
    const h = heights[i];
    if(cur.length > 0 && curH + h > CAPACITY_PX){
      pages.push(cur);
      cur = []; curH = 0;
    }
    cur.push(html);
    curH += h;
  });
  if(cur.length) pages.push(cur);
  if(pages.length === 0) pages.push([]);
  return pages;
}

async function openPrintPreview(q){
  const quote = q || currentQuote;
  if(!quote.sections || !quote.sections.length){
    alert('請先加入至少一個標題與報價項目');
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop">
    <div class="print-sheet" style="display:flex;align-items:center;justify-content:center;color:#888;">產生預覽中...</div>
  </div>`;
  const pages = await buildPages(quote);
  const total = pages.length;
  const sealChars = shortCompanyName().split('').map(ch=>`<span>${escapeHtml(ch)}</span>`).join('');
  const pagesHtml = pages.map((atomsArr, i) => {
    const topSeal = i > 0 ? `<div class="ps-seal ps-seal-top">${sealChars}</div>` : '';
    const bottomSeal = i < total - 1 ? `<div class="ps-seal ps-seal-bottom">${sealChars}</div>` : '';
    return `
    <div class="print-sheet">
      ${topSeal}
      ${bottomSeal}
      <div class="ps-pagenum">第 ${i+1} 頁,共 ${total} 頁&nbsp;&nbsp;|&nbsp;&nbsp;報價單號:${escapeHtml(quote.cno||'')}</div>
      ${atomsArr.join('')}
    </div>
  `;
  }).join('');
  const html = `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div style="width:100%;">
      <div class="modal-toolbar no-print">
        <button class="btn-ghost" onclick="closeModal()">關閉</button>
        <button class="btn-primary" onclick="window.print()">列印 / 另存 PDF(A4)</button>
      </div>
      <div class="print-pages">${pagesHtml}</div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}

/* =========================================================
   橫幅固定高度同步(topbar 改為 position:fixed 後,動態量測實際高度,
   避免手機版換行變高時蓋住下方內容)
========================================================= */
function syncTopbarHeight(){
  const el = document.querySelector('.topbar');
  if(!el) return;
  const h = el.offsetHeight;
  if(h > 0) document.documentElement.style.setProperty('--topbar-h', h + 'px');
}
(function initTopbarSync(){
  const el = document.querySelector('.topbar');
  if(!el) return;
  syncTopbarHeight();
  if(typeof ResizeObserver !== 'undefined'){
    new ResizeObserver(syncTopbarHeight).observe(el);
  } else {
    window.addEventListener('resize', syncTopbarHeight);
  }
})();
